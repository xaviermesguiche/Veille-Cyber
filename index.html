<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="VeilleCyber">
<meta name="theme-color" content="#1a1a2e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Veille Cyber ACI</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #f5f3ef;
  --bg2:       #ffffff;
  --bg3:       #eceae4;
  --border:    #ddd9d0;
  --text:      #1c1917;
  --text2:     #57534e;
  --text3:     #a8a29e;
  --accent:    #dc2626;
  --accent-l:  #fef2f2;
  --blue:      #1d4ed8;
  --blue-l:    #eff6ff;
  --green:     #15803d;
  --green-l:   #f0fdf4;
  --amber:     #b45309;
  --amber-l:   #fffbeb;
  --purple:    #7c3aed;
  --purple-l:  #f5f3ff;
  --navy:      #1a1a2e;
  --safe-top:  env(safe-area-inset-top, 0px);
  --safe-bot:  env(safe-area-inset-bottom, 0px);
  --font:      'Sora', sans-serif;
  --mono:      'JetBrains Mono', monospace;
  --r:         12px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111111; --bg2: #1c1c1e; --bg3: #2c2c2e;
    --border: #38383a; --text: #f5f5f7; --text2: #aeaeb2;
    --text3: #636366; --accent-l: #3a0000; --blue-l: #001a4d;
    --green-l: #002211; --amber-l: #2a1800; --purple-l: #1a0040;
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { font-size: 16px; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overscroll-behavior: none;
}

/* ── TOP NAV ── */
#topnav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: var(--navy);
  padding: calc(var(--safe-top) + 10px) 16px 10px;
  display: flex; align-items: center; gap: 12px;
}
.nav-logo {
  font-family: var(--mono); font-size: 13px; font-weight: 500;
  color: #fff; letter-spacing: .05em; display: flex; align-items: center; gap: 6px;
}
.logo-pulse {
  width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.8)} }
.nav-spacer { flex: 1; }
.nav-search-btn {
  width: 36px; height: 36px; border-radius: 10px;
  background: rgba(255,255,255,.1); border: none; color: #fff;
  font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.nav-refresh-btn {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--accent); border: none; color: #fff;
  font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: .15s;
}
.nav-refresh-btn:active { transform: scale(.92); }
.nav-refresh-btn.spinning { animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── SEARCH BAR ── */
#searchbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  background: var(--navy);
  padding: calc(var(--safe-top) + 10px) 12px 10px;
  display: none; align-items: center; gap: 8px;
}
#searchbar.visible { display: flex; }
#search-input {
  flex: 1; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.15);
  color: #fff; padding: 8px 14px; border-radius: 10px;
  font-size: 15px; font-family: var(--font);
}
#search-input::placeholder { color: rgba(255,255,255,.4); }
#search-input:focus { outline: none; background: rgba(255,255,255,.18); }
#search-cancel { color: rgba(255,255,255,.7); font-size: 14px; cursor: pointer; white-space: nowrap; }

/* ── FILTER CHIPS ── */
#chips {
  position: fixed; top: 57px; left: 0; right: 0; z-index: 99;
  background: var(--navy);
  padding: 0 12px 10px;
  display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch;
}
#chips::-webkit-scrollbar { display: none; }
.chip {
  padding: 5px 12px; border-radius: 20px; font-size: 12px;
  font-family: var(--mono); font-weight: 500;
  white-space: nowrap; cursor: pointer;
  background: rgba(255,255,255,.1); color: rgba(255,255,255,.7);
  border: 1px solid rgba(255,255,255,.1); transition: .15s;
  flex-shrink: 0;
}
.chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.chip:active { transform: scale(.95); }

/* ── STATS BAR ── */
#statsbar {
  position: fixed; top: 107px; left: 0; right: 0; z-index: 98;
  background: var(--bg3); border-bottom: 1px solid var(--border);
  padding: 8px 16px;
  display: flex; align-items: center; gap: 16px;
}
.stat-item { display: flex; align-items: center; gap: 5px; }
.stat-n { font-family: var(--mono); font-size: 14px; font-weight: 600; color: var(--text); }
.stat-n.blue { color: var(--blue); }
.stat-n.red { color: var(--accent); }
.stat-n.purple { color: var(--purple); }
.stat-l { font-size: 11px; color: var(--text3); }
.stats-refresh { margin-left: auto; font-size: 11px; color: var(--text3); font-family: var(--mono); }

/* ── CONTENT ── */
#content {
  padding-top: 145px;
  padding-bottom: calc(var(--safe-bot) + 70px);
  min-height: 100vh;
}

/* ── BOTTOM NAV ── */
#bottomnav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  background: var(--bg2); border-top: 1px solid var(--border);
  padding: 8px 0 calc(var(--safe-bot) + 8px);
  display: flex;
}
.bnav-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  gap: 3px; cursor: pointer; border: none; background: none;
  color: var(--text3); font-size: 11px; font-family: var(--font); padding: 4px 0;
  transition: .1s;
}
.bnav-btn.on { color: var(--accent); }
.bnav-btn .bi { font-size: 20px; }
.bnav-badge {
  position: absolute; top: -4px; right: calc(50% - 18px);
  background: var(--accent); color: #fff; border-radius: 10px;
  font-size: 9px; font-family: var(--mono); padding: 1px 5px; font-weight: 600;
}

/* ── FEED CARDS ── */
.card {
  background: var(--bg2); border-bottom: 1px solid var(--border);
  padding: 14px 16px; cursor: pointer; transition: background .1s;
  position: relative;
}
.card:active { background: var(--bg3); }
.card.saved-card { border-left: 3px solid var(--purple); }
.card-top {
  display: flex; align-items: center; gap: 6px; margin-bottom: 8px;
}
.card-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.card-src { font-family: var(--mono); font-size: 11px; color: var(--text3); font-weight: 500; text-transform: uppercase; letter-spacing: .04em; }
.card-time { margin-left: auto; font-size: 11px; color: var(--text3); font-family: var(--mono); }
.card-title { font-size: 15px; font-weight: 600; line-height: 1.4; color: var(--text); margin-bottom: 6px; }
.card.is-read .card-title { font-weight: 400; color: var(--text2); }
.card-exc { font-size: 13px; color: var(--text2); line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 8px; }
.card-footer { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 10px; padding: 2px 7px; border-radius: 6px; font-family: var(--mono); font-weight: 500; }
.t-apt   { background: var(--blue-l);   color: var(--blue);   }
.t-france{ background: var(--green-l);  color: var(--green);  }
.t-mal   { background: var(--accent-l); color: var(--accent); }
.t-infra { background: var(--amber-l);  color: var(--amber);  }
.t-def   { background: var(--bg3);      color: var(--text3);  }
.card-actions { margin-left: auto; display: flex; gap: 8px; }
.card-act-btn {
  font-size: 16px; color: var(--text3); cursor: pointer;
  width: 28px; height: 28px; border-radius: 8px; display: flex;
  align-items: center; justify-content: center; border: none; background: none;
  transition: .1s;
}
.card-act-btn:active { transform: scale(.88); }
.card-act-btn.saved { color: var(--purple); }
.card-saved-star { position: absolute; top: 14px; right: 16px; font-size: 12px; color: var(--purple); }

.section-header {
  padding: 12px 16px 6px;
  font-family: var(--mono); font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .08em; color: var(--text3);
  background: var(--bg3); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}

.empty-state { padding: 48px 24px; text-align: center; }
.empty-icon { font-size: 40px; opacity: .3; margin-bottom: 12px; }
.empty-text { font-size: 14px; color: var(--text3); }
.loading-state { padding: 32px 24px; text-align: center; }
.loading-dots { display: flex; justify-content: center; gap: 6px; margin-bottom: 12px; }
.loading-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: ldot .8s infinite; }
.loading-dot:nth-child(2) { animation-delay: .15s; }
.loading-dot:nth-child(3) { animation-delay: .3s; }
@keyframes ldot { 0%,80%,100%{transform:scale(.8);opacity:.4} 40%{transform:scale(1.1);opacity:1} }
.loading-text { font-size: 13px; color: var(--text3); font-family: var(--mono); }

/* ── READER SHEET ── */
#reader {
  position: fixed; inset: 0; z-index: 300;
  background: var(--bg2);
  transform: translateY(100%); transition: transform .3s cubic-bezier(.32,.72,0,1);
  display: flex; flex-direction: column; overflow: hidden;
}
#reader.open { transform: translateY(0); }
#reader-header {
  background: var(--navy);
  padding: calc(var(--safe-top) + 12px) 16px 12px;
  display: flex; align-items: center; gap: 10px; flex-shrink: 0;
}
#reader-back {
  width: 36px; height: 36px; border-radius: 10px;
  background: rgba(255,255,255,.1); border: none; color: #fff;
  font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
}
#reader-title { flex: 1; font-size: 13px; font-weight: 500; color: rgba(255,255,255,.8); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
#reader-actions { display: flex; gap: 6px; }
.reader-hdr-btn {
  width: 36px; height: 36px; border-radius: 10px;
  background: rgba(255,255,255,.1); border: none; color: #fff;
  font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: .1s;
}
.reader-hdr-btn:active { transform: scale(.92); }
.reader-hdr-btn.saved { background: var(--purple); }
#reader-body { flex: 1; overflow-y: auto; padding: 20px 16px; -webkit-overflow-scrolling: touch; }
.r-src-row { display: flex; align-items: center; gap: 7px; margin-bottom: 12px; }
.r-src-dot { width: 9px; height: 9px; border-radius: 50%; }
.r-src-name { font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .04em; }
.r-src-date { font-size: 11px; color: var(--text3); }
.r-title { font-size: 20px; font-weight: 700; line-height: 1.3; margin-bottom: 12px; }
.r-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 16px; }
.r-tag { font-size: 10px; padding: 2px 8px; border-radius: 6px; font-family: var(--mono); }
.r-content { font-size: 15px; line-height: 1.75; color: var(--text2); }
.r-content p { margin-bottom: .9em; }
.r-content a { color: var(--blue); }
.r-content h2,.r-content h3 { color: var(--text); margin: 1.4em 0 .4em; font-size: 16px; }
.r-content code { background: var(--bg3); padding: 1px 5px; border-radius: 4px; font-family: var(--mono); font-size: 13px; }
.r-content blockquote { border-left: 3px solid var(--accent); padding-left: 12px; color: var(--text3); margin: 1em 0; font-style: italic; }
.r-content img { max-width: 100%; border-radius: 8px; margin: .8em 0; }
.r-open-btn {
  display: block; margin: 20px 0; padding: 12px 16px; background: var(--navy);
  color: #fff; text-decoration: none; border-radius: 10px; font-size: 14px;
  font-weight: 600; text-align: center; font-family: var(--font);
}
.r-note-box { margin: 16px 0; padding: 14px; border-radius: 10px; background: var(--purple-l); border: 1px solid #ddd6fe; }
.r-note-label { font-size: 11px; font-family: var(--mono); font-weight: 600; color: var(--purple); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .05em; }
.r-note-ta { width: 100%; min-height: 70px; border: 1px solid #ddd6fe; border-radius: 8px; padding: 8px 10px; font-size: 14px; font-family: var(--font); color: var(--text); background: var(--bg2); resize: none; line-height: 1.5; }
.r-note-ta:focus { outline: none; border-color: var(--purple); }
.r-note-save { margin-top: 8px; padding: 8px 16px; background: var(--purple); color: #fff; border: none; border-radius: 8px; font-size: 13px; font-family: var(--font); font-weight: 600; cursor: pointer; }
mark { background: #fef08a; border-radius: 2px; }
#reader-footer {
  padding: 8px 16px calc(var(--safe-bot) + 8px);
  background: var(--bg2); border-top: 1px solid var(--border);
  display: flex; gap: 8px; flex-shrink: 0;
}
.r-nav-btn {
  flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--bg3); color: var(--text2); font-size: 18px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.r-nav-btn:active { background: var(--border); }

/* ── PULL TO REFRESH INDICATOR ── */
#ptr { text-align: center; padding: 0; height: 0; overflow: hidden; transition: height .2s; }
#ptr.visible { height: 48px; padding: 12px; }
.ptr-text { font-size: 12px; color: var(--text3); font-family: var(--mono); }

/* ── TOAST ── */
#toast {
  position: fixed; bottom: calc(var(--safe-bot) + 76px); left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--navy); color: #fff; padding: 9px 18px; border-radius: 20px;
  font-size: 13px; font-family: var(--mono); opacity: 0; transition: all .25s;
  z-index: 500; white-space: nowrap; pointer-events: none;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- TOP NAV -->
<div id="topnav">
  <div class="nav-logo"><span class="logo-pulse"></span>VEILLE·CYBER</div>
  <div class="nav-spacer"></div>
  <button class="nav-search-btn" onclick="toggleSearch()">⌕</button>
  <button class="nav-refresh-btn" id="refresh-btn" onclick="doRefresh()">↻</button>
</div>

<!-- SEARCH BAR -->
<div id="searchbar">
  <input type="search" id="search-input" placeholder="Rechercher…" oninput="onSearch()" autocomplete="off">
  <span id="search-cancel" onclick="closeSearch()">Annuler</span>
</div>

<!-- FILTER CHIPS -->
<div id="chips">
  <span class="chip on" onclick="setView('all',this)">Tout</span>
  <span class="chip" onclick="setView('unread',this)">🔵 Non lus</span>
  <span class="chip" onclick="setView('saved',this)">★ Favoris</span>
  <span class="chip" onclick="setKw('apt',this)">APT</span>
  <span class="chip" onclick="setKw('france',this)">France</span>
  <span class="chip" onclick="setKw('malware',this)">Malware</span>
  <span class="chip" onclick="setKw('vuln',this)">CVE</span>
  <span class="chip" onclick="setKw('infra',this)">Infra</span>
  <span class="chip" onclick="setKw('cybercrim',this)">Cybercrim</span>
</div>

<!-- STATS BAR -->
<div id="statsbar">
  <div class="stat-item"><span class="stat-n blue" id="s-unread">–</span><span class="stat-l">non lus</span></div>
  <div class="stat-item"><span class="stat-n" id="s-total">–</span><span class="stat-l">articles</span></div>
  <div class="stat-item"><span class="stat-n purple" id="s-saved">–</span><span class="stat-l">favoris</span></div>
  <span class="stats-refresh" id="s-time"></span>
</div>

<!-- CONTENT -->
<div id="content">
  <div id="ptr"><span class="ptr-text">↓ Relâcher pour rafraîchir</span></div>
  <div id="feed"><div class="loading-state"><div class="loading-dots"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div></div><div class="loading-text">Chargement des flux…</div></div></div>
</div>

<!-- BOTTOM NAV -->
<div id="bottomnav">
  <button class="bnav-btn on" id="bn-feed" onclick="switchTab('feed')">
    <span class="bi">📰</span>Feed
  </button>
  <button class="bnav-btn" id="bn-sources" onclick="switchTab('sources')">
    <span class="bi">📡</span>Sources
  </button>
  <button class="bnav-btn" id="bn-saved" onclick="switchTab('saved')">
    <span class="bi">★</span>Favoris
  </button>
  <button class="bnav-btn" id="bn-settings" onclick="switchTab('settings')">
    <span class="bi">⚙</span>Réglages
  </button>
</div>

<!-- READER SHEET -->
<div id="reader">
  <div id="reader-header">
    <button id="reader-back" onclick="closeReader()">←</button>
    <span id="reader-title">–</span>
    <div id="reader-actions">
      <button class="reader-hdr-btn" id="r-save-btn" onclick="toggleSave()">★</button>
      <button class="reader-hdr-btn" id="r-read-btn" onclick="toggleRead()">◎</button>
    </div>
  </div>
  <div id="reader-body"></div>
  <div id="reader-footer">
    <button class="r-nav-btn" onclick="nav(-1)">↑</button>
    <button class="r-nav-btn" onclick="nav(1)">↓</button>
  </div>
</div>

<div id="toast"></div>

<script>
// ── CONFIG ─────────────────────────────────────────────────────────────────
const PROXIES = [
  u => `https://api.allorigins.win/get?url=${encodeURIComponent(u)}`,
  u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
  u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
];

const DEFAULT_FEEDS = [
  {id:'korben',      name:'Korben',          url:'https://korben.info/feed',                           color:'#2563eb', cat:'Veille FR'},
  {id:'zataz',       name:'ZATAZ',           url:'https://www.zataz.com/feed/',                         color:'#dc2626', cat:'Veille FR'},
  {id:'anssi',       name:'ANSSI/CERT-FR',   url:'https://www.cert.ssi.gouv.fr/feed/',                 color:'#15803d', cat:'Officiel'},
  {id:'sentinelone', name:'SentinelOne',     url:'https://www.sentinelone.com/labs/feed/',              color:'#7c3aed', cat:'Technique'},
  {id:'theregister', name:'The Register',    url:'https://www.theregister.com/security/headlines.atom', color:'#dc2626', cat:'Technique'},
  {id:'bleeping',    name:'BleepingComputer',url:'https://www.bleepingcomputer.com/feed/',              color:'#0891b2', cat:'Technique'},
  {id:'eset',        name:'ESET Research',   url:'https://www.welivesecurity.com/en/feed/',             color:'#b45309', cat:'Technique'},
];

const KW = {
  apt:      ['apt28','apt29','apt ','sandworm','lazarus','volt typhoon','gru','fsb','nation-state'],
  france:   ['france','anssi','dgsi','ministère','ants','hexdex','certfr'],
  malware:  ['malware','ransomware','backdoor','trojan','rootkit','spyware','botnet'],
  vuln:     ['cve-','zero-day','0-day','exploit','vulnerability','rce'],
  cybercrim:['cybercriminal','darkweb','breach','data leak','fuite','hacker arrested'],
  infra:    ['critical infrastructure','nucléaire','nuclear','scada','ics','power grid'],
};

const HIGHLIGHT = ['APT28','Sandworm','Lazarus','GRU','ANSSI','ANTS','HexDex','fast16','nucléaire','zero-day','CVE-'];

const LS = {
  feeds:   () => JSON.parse(localStorage.getItem('vc_feeds')||'null') || DEFAULT_FEEDS,
  arts:    () => JSON.parse(localStorage.getItem('vc_arts')||'[]'),
  read:    () => new Set(JSON.parse(localStorage.getItem('vc_read')||'[]')),
  saved:   () => new Set(JSON.parse(localStorage.getItem('vc_saved')||'[]')),
  notes:   () => JSON.parse(localStorage.getItem('vc_notes')||'{}'),
};

let feeds   = LS.feeds();
let articles = LS.arts();
let readSet  = LS.read();
let savedSet = LS.saved();
let notes    = LS.notes();

let filter = { view:'all', kw:null, q:'' };
let displayed = [], curIdx = null, curTab = 'feed';
let searchTimer = null, isRefreshing = false;

function save() {
  localStorage.setItem('vc_feeds', JSON.stringify(feeds));
  localStorage.setItem('vc_arts',  JSON.stringify(articles.slice(0,800)));
  localStorage.setItem('vc_read',  JSON.stringify([...readSet]));
  localStorage.setItem('vc_saved', JSON.stringify([...savedSet]));
  localStorage.setItem('vc_notes', JSON.stringify(notes));
}

// ── TOAST ──────────────────────────────────────────────────────────────────
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

// ── FETCH ──────────────────────────────────────────────────────────────────
async function fetchWithProxy(url) {
  for (const p of PROXIES) {
    try {
      const r = await fetch(p(url), { signal: AbortSignal.timeout(9000) });
      if (!r.ok) continue;
      const ct = r.headers.get('content-type')||'';
      if (ct.includes('json')) {
        const j = await r.json();
        return j.contents || j.data || '';
      }
      return await r.text();
    } catch { continue; }
  }
  return null;
}

function stripHtml(h) {
  const d = document.createElement('div'); d.innerHTML = h;
  return d.textContent.replace(/\s+/g,' ').trim();
}

function detectKw(text) {
  const tl = text.toLowerCase();
  return Object.entries(KW).filter(([,kws]) => kws.some(k => tl.includes(k))).map(([k]) => k);
}

async function fetchFeed(feed) {
  try {
    const text = await fetchWithProxy(feed.url);
    if (!text) return [];
    const doc = new DOMParser().parseFromString(text, 'text/xml');
    const isAtom = !!doc.querySelector('feed');
    return [...doc.querySelectorAll(isAtom?'entry':'item')].slice(0,40).map(e => {
      const id = feed.id+'::' + (e.querySelector(isAtom?'id':'guid')?.textContent||Math.random());
      const title = e.querySelector('title')?.textContent?.trim() || '(sans titre)';
      const link  = isAtom ? e.querySelector('link')?.getAttribute('href') : e.querySelector('link')?.textContent||'#';
      const raw   = e.querySelector(isAtom?'content,summary':'description')?.textContent||'';
      const excerpt = stripHtml(raw).slice(0,280);
      const ds    = e.querySelector(isAtom?'published,updated':'pubDate')?.textContent;
      const date  = ds ? new Date(ds).toISOString() : new Date().toISOString();
      return { id, feedId:feed.id, feedName:feed.name, feedColor:feed.color,
               title, link, date, excerpt, content:raw, tags:detectKw(title+' '+excerpt) };
    });
  } catch { return []; }
}

// ── REFRESH ────────────────────────────────────────────────────────────────
async function doRefresh() {
  if (isRefreshing) return;
  isRefreshing = true;
  const btn = document.getElementById('refresh-btn');
  btn.classList.add('spinning');
  let loaded=0, added=0;
  const existing = new Set(articles.map(a=>a.id));
  await Promise.all(feeds.map(async feed => {
    const items = await fetchFeed(feed);
    loaded++;
    items.forEach(a => { if (!existing.has(a.id)) { articles.unshift(a); added++; existing.add(a.id); } });
    updateStats();
  }));
  articles.sort((a,b) => new Date(b.date)-new Date(a.date));
  articles = articles.slice(0,800);
  save();
  renderFeed();
  updateStats();
  btn.classList.remove('spinning');
  isRefreshing = false;
  const now = new Date();
  document.getElementById('s-time').textContent = now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  toast(added > 0 ? `+${added} nouveaux articles` : 'À jour');
}

// ── FILTER ────────────────────────────────────────────────────────────────
function getFiltered() {
  let list = [...articles];
  if (filter.view==='unread') list = list.filter(a => !readSet.has(a.id));
  if (filter.view==='saved')  list = list.filter(a =>  savedSet.has(a.id));
  if (filter.kw) list = list.filter(a => (a.tags||[]).includes(filter.kw));
  if (filter.q) { const q=filter.q.toLowerCase(); list = list.filter(a => a.title.toLowerCase().includes(q)||a.excerpt.toLowerCase().includes(q)); }
  return list;
}

// ── RENDER FEED ───────────────────────────────────────────────────────────
function tagCls(t) { return {apt:'t-apt',france:'t-france',malware:'t-mal',infra:'t-infra',vuln:'t-apt',cybercrim:'t-france'}[t]||'t-def'; }
function tagLbl(t) { return {apt:'APT',france:'France',malware:'Malware',vuln:'CVE',cybercrim:'Cybercrim',infra:'Infra'}[t]||t; }

function ago(iso) {
  const s = Math.floor((Date.now()-new Date(iso))/1000);
  if(s<60) return 'instant'; if(s<3600) return Math.floor(s/60)+'m';
  if(s<86400) return Math.floor(s/3600)+'h'; if(s<604800) return Math.floor(s/86400)+'j';
  return new Date(iso).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
}

function hlText(text, q) {
  if (!q) return text;
  return text.replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,'gi'), '<mark>$1</mark>');
}

function renderFeed() {
  displayed = getFiltered();
  const feed = document.getElementById('feed');
  if (!displayed.length) {
    feed.innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">Aucun article</div></div>`;
    return;
  }
  const q = filter.q.toLowerCase();
  let html = '';
  let lastDate = '';
  displayed.forEach((a, i) => {
    const day = new Date(a.date).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
    if (day !== lastDate) {
      html += `<div class="section-header"><span>${day}</span></div>`;
      lastDate = day;
    }
    const tags = (a.tags||[]).slice(0,3).map(t=>`<span class="tag ${tagCls(t)}">${tagLbl(t)}</span>`).join('');
    const saved = savedSet.has(a.id);
    let title = a.title;
    if (q) title = hlText(title, q);
    html += `<div class="card ${readSet.has(a.id)?'is-read':''} ${saved?'saved-card':''}" data-i="${i}" onclick="openArt(${i})">
      <div class="card-top">
        <span class="card-dot" style="background:${a.feedColor}"></span>
        <span class="card-src">${a.feedName}</span>
        <span class="card-time">${ago(a.date)}</span>
      </div>
      <div class="card-title">${title}</div>
      <div class="card-exc">${a.excerpt}</div>
      <div class="card-footer">
        ${tags}
        <div class="card-actions" onclick="event.stopPropagation()">
          <button class="card-act-btn ${saved?'saved':''}" onclick="quickSave(${i})" title="Favori">${saved?'★':'☆'}</button>
          <button class="card-act-btn" onclick="quickRead(${i})" title="Marquer lu">${readSet.has(a.id)?'●':'○'}</button>
        </div>
      </div>
    </div>`;
  });
  feed.innerHTML = html;
  updateStats();
}

function renderSources() {
  const cats = {};
  feeds.forEach(f => (cats[f.cat]=cats[f.cat]||[]).push(f));
  let html = '';
  for (const [cat, fds] of Object.entries(cats)) {
    html += `<div class="section-header"><span>${cat}</span></div>`;
    fds.forEach(f => {
      const count = articles.filter(a=>a.feedId===f.id).length;
      const unread = articles.filter(a=>a.feedId===f.id&&!readSet.has(a.id)).length;
      html += `<div class="card" onclick="filterByFeed('${f.id}')">
        <div class="card-top">
          <span class="card-dot" style="background:${f.color}"></span>
          <span class="card-src">${f.name}</span>
          <span class="card-time">${count} art.</span>
        </div>
        <div class="card-footer">
          ${unread>0?`<span class="tag t-apt">${unread} non lus</span>`:'<span class="tag t-def">Tout lu</span>'}
        </div>
      </div>`;
    });
  }
  html += `<div class="section-header"><span>Ajouter un flux</span></div>
    <div style="padding:14px 16px;background:var(--bg2)">
      <div style="display:flex;gap:8px">
        <input id="add-url" type="url" placeholder="https://example.com/feed"
          style="flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;font-family:var(--font);background:var(--bg3);color:var(--text)">
        <button onclick="addFeed()" style="padding:10px 16px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-size:14px;font-family:var(--font);cursor:pointer">+</button>
      </div>
    </div>`;
  document.getElementById('feed').innerHTML = html;
}

function renderSaved() {
  const saved = articles.filter(a=>savedSet.has(a.id));
  if (!saved.length) {
    document.getElementById('feed').innerHTML = `<div class="empty-state"><div class="empty-icon">★</div><div class="empty-text">Aucun favori</div></div>`;
    return;
  }
  let html = `<div class="section-header"><span>${saved.length} article${saved.length>1?'s':''} sauvegardé${saved.length>1?'s':''}</span></div>`;
  saved.forEach((a, i) => {
    const idx = displayed.findIndex(d=>d.id===a.id);
    const note = notes[a.id];
    html += `<div class="card saved-card" onclick="openArt(${idx>=0?idx:0})">
      <div class="card-top">
        <span class="card-dot" style="background:${a.feedColor}"></span>
        <span class="card-src">${a.feedName}</span>
        <span class="card-time">${ago(a.date)}</span>
      </div>
      <div class="card-title">${a.title}</div>
      ${note?`<div class="card-exc" style="color:var(--purple);font-size:12px">📝 ${note.slice(0,100)}${note.length>100?'…':''}</div>`:''}
    </div>`;
  });
  document.getElementById('feed').innerHTML = html;
}

function renderSettings() {
  const totalRead = readSet.size;
  const totalArts = articles.length;
  document.getElementById('feed').innerHTML = `
    <div class="section-header"><span>Statistiques</span></div>
    <div class="card">
      <div class="card-title" style="font-size:14px">📊 Vue d'ensemble</div>
      <div class="card-exc">${totalArts} articles · ${totalRead} lus · ${savedSet.size} favoris · ${feeds.length} sources</div>
    </div>
    <div class="section-header"><span>Thèse ACI</span></div>
    <div class="card">
      <div class="card-title" style="font-size:14px">🎓 CNAM Criminologie</div>
      <div class="card-exc">Acteurs cyber hybrides — Analyse criminologique des groupes à double mission — Enjeux opérationnels pour le renseignement</div>
    </div>
    <div class="section-header"><span>Actions</span></div>
    <div class="card" onclick="markAllRead()">
      <div class="card-title" style="font-size:14px">✓ Tout marquer comme lu</div>
    </div>
    <div class="card" onclick="if(confirm('Vider le cache des articles ?')){articles=[];save();renderFeed();toast('Cache vidé');}">
      <div class="card-title" style="font-size:14px;color:var(--accent)">🗑 Vider le cache</div>
    </div>
    <div class="section-header"><span>Installation PWA</span></div>
    <div class="card">
      <div class="card-title" style="font-size:14px">📱 Installer sur l'écran d'accueil</div>
      <div class="card-exc">iOS Safari : bouton Partager → "Sur l'écran d'accueil"<br>Android Chrome : menu ⋮ → "Ajouter à l'écran d'accueil"</div>
    </div>`;
}

// ── OPEN ARTICLE ──────────────────────────────────────────────────────────
function openArt(i) {
  if (i<0||i>=displayed.length) return;
  curIdx = i;
  const a = displayed[i];
  if (!readSet.has(a.id)) { readSet.add(a.id); save(); }

  document.getElementById('reader-title').textContent = a.feedName;
  updateReaderBtns();

  const tags = (a.tags||[]).map(t=>`<span class="r-tag ${tagCls(t)}">${tagLbl(t)}</span>`).join('');
  let body = sanitize(a.content || `<p>${a.excerpt}</p>`);
  HIGHLIGHT.forEach(t => {
    body = body.replace(new RegExp(`(?<![<"'/])\\b(${t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})\\b(?![^<]*>)`,'gi'),'<mark>$1</mark>');
  });

  document.getElementById('reader-body').innerHTML = `
    <div class="r-src-row">
      <span class="r-src-dot" style="background:${a.feedColor}"></span>
      <span class="r-src-name">${a.feedName}</span>
      <span class="r-src-date"> · ${new Date(a.date).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})}</span>
    </div>
    <div class="r-title">${a.title}</div>
    ${tags?`<div class="r-tags">${tags}</div>`:''}
    <div class="r-content">${body}</div>
    <a class="r-open-btn" href="${a.link}" target="_blank">Lire l'article complet ↗</a>
    <div class="r-note-box">
      <div class="r-note-label">★ Note thèse / Cadre ACI</div>
      <textarea class="r-note-ta" id="note-ta" placeholder="Analyse, liens avec ACI…">${notes[a.id]||''}</textarea>
      <button class="r-note-save" onclick="saveNote('${a.id}')">Enregistrer</button>
    </div>`;
  document.getElementById('reader-body').scrollTop = 0;
  document.getElementById('reader').classList.add('open');
  document.body.style.overflow = 'hidden';

  // Update card in feed
  renderFeed();
}

function closeReader() {
  document.getElementById('reader').classList.remove('open');
  document.body.style.overflow = '';
}

function sanitize(h) {
  const d=document.createElement('div'); d.innerHTML=h;
  d.querySelectorAll('script,style,iframe').forEach(el=>el.remove());
  d.querySelectorAll('a').forEach(el=>el.setAttribute('target','_blank'));
  d.querySelectorAll('img').forEach(el=>{el.style.maxWidth='100%';el.removeAttribute('width');el.removeAttribute('height')});
  return d.innerHTML;
}

function updateReaderBtns() {
  if (curIdx===null) return;
  const a = displayed[curIdx];
  if (!a) return;
  const sb = document.getElementById('r-save-btn');
  sb.className = 'reader-hdr-btn' + (savedSet.has(a.id)?' saved':'');
  sb.textContent = savedSet.has(a.id)?'★':'☆';
}

function toggleSave() {
  if (curIdx===null) return;
  const a = displayed[curIdx];
  savedSet.has(a.id)?savedSet.delete(a.id):savedSet.add(a.id);
  save(); updateReaderBtns(); updateStats();
  toast(savedSet.has(a.id)?'Ajouté aux favoris':'Retiré des favoris');
}

function toggleRead() {
  if (curIdx===null) return;
  const a = displayed[curIdx];
  readSet.has(a.id)?readSet.delete(a.id):readSet.add(a.id);
  save(); updateStats();
}

function quickSave(i) {
  const a = displayed[i];
  savedSet.has(a.id)?savedSet.delete(a.id):savedSet.add(a.id);
  save(); updateStats(); renderFeed();
  toast(savedSet.has(a.id)?'Ajouté ★':'Retiré');
}

function quickRead(i) {
  const a = displayed[i];
  readSet.has(a.id)?readSet.delete(a.id):readSet.add(a.id);
  save(); updateStats(); renderFeed();
}

function nav(d) {
  const n = (curIdx||0)+d;
  if (n>=0&&n<displayed.length) openArt(n);
}

function saveNote(id) {
  notes[id] = document.getElementById('note-ta')?.value||'';
  save(); toast('Note enregistrée ✓');
}

function markAllRead() {
  displayed.forEach(a=>readSet.add(a.id));
  save(); updateStats(); renderFeed(); toast('Tout marqué comme lu');
}

// ── VIEWS ─────────────────────────────────────────────────────────────────
function setView(v, btn) {
  filter = {...filter, view:v, kw:null};
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
  btn?.classList.add('on');
  curTab='feed'; updateBottomNav();
  renderFeed();
}

function setKw(kw, btn) {
  filter.kw = filter.kw===kw ? null : kw;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
  if (filter.kw) btn?.classList.add('on');
  else document.querySelector('.chip[onclick*="all"]')?.classList.add('on');
  curTab='feed'; updateBottomNav();
  renderFeed();
}

function filterByFeed(id) {
  filter = {view:'feed', feedId:id, kw:null, q:''};
  displayed = articles.filter(a=>a.feedId===id);
  curTab='feed'; updateBottomNav();
  document.querySelector('.chip[onclick*="all"]')?.classList.add('on');
  renderFeedDirect();
}

function renderFeedDirect() {
  const feed = document.getElementById('feed');
  if (!displayed.length) { feed.innerHTML='<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">Aucun article</div></div>'; return; }
  let html='';
  displayed.forEach((a,i) => {
    const tags=(a.tags||[]).slice(0,3).map(t=>`<span class="tag ${tagCls(t)}">${tagLbl(t)}</span>`).join('');
    html+=`<div class="card ${readSet.has(a.id)?'is-read':''}" data-i="${i}" onclick="openArt(${i})">
      <div class="card-top"><span class="card-dot" style="background:${a.feedColor}"></span><span class="card-src">${a.feedName}</span><span class="card-time">${ago(a.date)}</span></div>
      <div class="card-title">${a.title}</div>
      <div class="card-exc">${a.excerpt}</div>
      <div class="card-footer">${tags}</div>
    </div>`;
  });
  feed.innerHTML=html;
}

function switchTab(tab) {
  curTab=tab; updateBottomNav();
  if (tab==='feed') { filter={view:'all',kw:null,q:''}; document.querySelector('.chip[onclick*="all"]')?.classList.add('on'); renderFeed(); }
  else if (tab==='sources') renderSources();
  else if (tab==='saved') { displayed=[...articles]; renderSaved(); }
  else if (tab==='settings') renderSettings();
}

function updateBottomNav() {
  ['feed','sources','saved','settings'].forEach(t => {
    document.getElementById('bn-'+t)?.classList.toggle('on', t===curTab);
  });
}

// ── SEARCH ────────────────────────────────────────────────────────────────
function toggleSearch() {
  const sb = document.getElementById('searchbar');
  sb.classList.toggle('visible');
  if (sb.classList.contains('visible')) document.getElementById('search-input').focus();
  else { filter.q=''; renderFeed(); }
}
function closeSearch() {
  document.getElementById('searchbar').classList.remove('visible');
  document.getElementById('search-input').value='';
  filter.q=''; renderFeed();
}
function onSearch() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { filter.q=document.getElementById('search-input').value.trim(); renderFeed(); }, 350);
}

// ── STATS ─────────────────────────────────────────────────────────────────
function updateStats() {
  document.getElementById('s-total').textContent = articles.length;
  document.getElementById('s-unread').textContent = articles.filter(a=>!readSet.has(a.id)).length;
  document.getElementById('s-saved').textContent = savedSet.size;
}

// ── ADD FEED ──────────────────────────────────────────────────────────────
async function addFeed() {
  const url = document.getElementById('add-url')?.value?.trim();
  if (!url) return;
  const id = 'c'+Date.now();
  const colors = ['#2563eb','#dc2626','#15803d','#7c3aed','#0891b2'];
  const color = colors[feeds.length%colors.length];
  let name; try { name=new URL(url).hostname.replace('www.',''); } catch { name=url; }
  feeds.push({id,name,url,color,cat:'Autre'});
  toast(`Ajout de ${name}…`);
  const items = await fetchFeed({id,name,url,color});
  const ex = new Set(articles.map(a=>a.id));
  items.forEach(a=>{ if(!ex.has(a.id)) articles.unshift(a); });
  articles.sort((a,b)=>new Date(b.date)-new Date(a.date));
  save(); renderSources(); updateStats();
  toast(`${items.length} articles chargés`);
}

// ── PULL TO REFRESH ───────────────────────────────────────────────────────
let ptStart=0, ptActive=false;
document.getElementById('content').addEventListener('touchstart', e => {
  if (document.getElementById('content').scrollTop===0) { ptStart=e.touches[0].clientY; ptActive=true; }
}, {passive:true});
document.getElementById('content').addEventListener('touchmove', e => {
  if (!ptActive) return;
  const dy = e.touches[0].clientY - ptStart;
  if (dy>60) { document.getElementById('ptr').classList.add('visible'); }
}, {passive:true});
document.getElementById('content').addEventListener('touchend', e => {
  if (!ptActive) return;
  ptActive=false;
  const ptr = document.getElementById('ptr');
  if (ptr.classList.contains('visible')) { ptr.classList.remove('visible'); doRefresh(); }
});

// ── SWIPE BACK FROM READER ────────────────────────────────────────────────
let swipeStart=0;
document.getElementById('reader').addEventListener('touchstart', e => { swipeStart=e.touches[0].clientX; }, {passive:true});
document.getElementById('reader').addEventListener('touchend', e => {
  if (e.changedTouches[0].clientX - swipeStart > 80 && swipeStart < 40) closeReader();
});

// ── SERVICE WORKER ────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

// ── INIT ──────────────────────────────────────────────────────────────────
async function init() {
  updateStats();
  if (articles.length) {
    displayed = getFiltered();
    renderFeed();
    toast(`${articles.length} articles en cache`);
  }
  await doRefresh();
  setInterval(()=>doRefresh(), 30*60*1000);
}

init();
</script>
